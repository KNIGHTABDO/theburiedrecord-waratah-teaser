name: Render teaser
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Install headless Chrome for the map bake
        run: |
          npm i --no-save --no-audit --no-fund puppeteer-core@24
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer" | tail -1
      - name: Bake satellite map (globe to Durban)
        env:
          NAME: durban
          STYLE: satellite
          PROJECTION: globe
          FROM: "20,0"
          CENTER: "29.8,-31.2"
          ZSTART: "1.85"
          ZEND: "7.0"
          DUR: "5.5"
          HOLD: "0.6"
          COUNTRIES: "South Africa:#B08D57"
          POINTS: "31.03,-29.87;30.3,-31.0;28.95,-32.35;27.8,-33.4"
          OUT: assets/map
        run: |
          node tools/bake-basemap.mjs 2>&1 | tail -5
          echo "window.__WARATAH_MAP = $(cat assets/map/durban-coords.json);" > assets/map/durban-coords.js
          ls -la assets/map
      - name: Synthesize sea + drone bed
        run: |
          ffmpeg -nostdin -v error -y \
            -f lavfi -i "anoisesrc=color=brown:amplitude=0.35:duration=27.5:seed=7" \
            -f lavfi -i "sine=frequency=55:duration=27.5" \
            -f lavfi -i "sine=frequency=82.4:duration=27.5" \
            -filter_complex "[0]lowpass=f=600,volume=0.9,tremolo=f=0.12:d=0.6[sea];[1]volume=0.35[a];[2]volume=0.18[b];[sea][a][b]amix=inputs=3:normalize=0,afade=t=in:d=2,afade=t=out:st=24.5:d=3,aformat=channel_layouts=stereo[o]" \
            -map "[o]" -ar 48000 assets/sfx/bed.wav
      - name: Check
        run: npx --yes hyperframes@0.8.214 check 2>&1 | tail -15
      - name: Render
        run: |
          mkdir -p out
          npx --yes hyperframes@0.8.214 render -o out/waratah_teaser.mp4 -q delivery --quiet 2>&1 | tail -20
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of compact out/waratah_teaser.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: waratah-teaser
          path: out/waratah_teaser.mp4
          compression-level: 0
          retention-days: 30
